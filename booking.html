<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Appointment | The Tipssy Toe</title>
<style>body{margin:0;background:#f7f3ee;color:#292522;font-family:Arial,sans-serif}.wrap{max-width:700px;margin:40px auto;padding:20px}.card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 35px #0001}h1{font-family:Georgia,serif}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:12px;font-weight:bold;color:#666}input,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px;margin-top:6px}button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:10px;background:#b58b5b;color:white;font-weight:bold;cursor:pointer}.full{grid-column:1/-1}.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.slot{width:auto;margin:0;padding:9px 12px;background:#eee;color:#333}.slot.selected{background:#b58b5b;color:#fff}.slot:disabled{opacity:.35;cursor:not-allowed}.msg{margin-top:14px;font-weight:bold}.rate{margin-top:6px;font-weight:bold;font-size:13px;color:#b58b5b}.offer{font-size:12px;color:#777;margin-top:3px}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><h1>Book Your Appointment</h1><p>Select your service, date and available time.</p>
<div class="grid"><div class="full"><label>Full Name</label><input id="name" required></div><div><label>Mobile</label><input id="phone" required></div><div><label>Email</label><input id="email" type="email"></div><div><label>Service</label><select id="service"><option value="">Loading services...</option></select><div id="serviceRate" class="rate"></div></div><div><label>Combo Offers</label><select id="combo"><option value="">Loading combo offers...</option></select><div id="comboRate" class="rate"></div></div><div><label>Date</label><input id="date" type="date"></div><div class="full"><label>Available Time</label><div id="slots" class="slots"></div><input id="time" type="hidden"></div></div><button onclick="book()">Confirm Booking</button><div id="msg" class="msg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const db=window.tipssySupabase;const slots=["10:00 AM","11:00 AM","12:00 PM","1:00 PM","2:00 PM","3:00 PM","4:00 PM","5:00 PM","6:00 PM","7:00 PM"];let booked=new Set();
const today=new Date();date.min=today.toISOString().split("T")[0];
async function loadServices(){let [{data:sv,error:se},{data:co,error:ce}]=await Promise.all([db.from("services").select("name,price").eq("status","Active").order("name"),db.from("combos").select("name,price,includes").order("name")]);if(se||ce){msg.textContent=(se||ce).message;return}service.innerHTML='<option value="">Select service</option>'+(sv||[]).map(x=>`<option value="${esc(x.name)}" data-price="${x.price}">${esc(x.name)} — ₹${Number(x.price).toFixed(0)}</option>`).join("");combo.innerHTML='<option value="">No combo / Select combo</option>'+(co||[]).map(x=>`<option value="${esc(x.name)}" data-price="${x.price}" data-includes="${esc(x.includes||"")}">${esc(x.name)} — ₹${Number(x.price).toFixed(0)}</option>`).join("")}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showRates(){let so=service.options[service.selectedIndex],co=combo.options[combo.selectedIndex];serviceRate.textContent=so&&so.dataset.price?`Service Rate: ₹${Number(so.dataset.price).toFixed(0)}`:"";comboRate.innerHTML=co&&co.dataset.price?`Combo Offer: ₹${Number(co.dataset.price).toFixed(0)}${co.dataset.includes?`<div class="offer">Includes: ${esc(co.dataset.includes)}</div>`:""}`:""}
async function loadSlots(){time.value="";let d=date.value;if(!d){slotsEl.innerHTML="Select a date first.";return}let {data,error}=await db.from("appointments").select("time").eq("date",d);if(error){msg.textContent=error.message;return}booked=new Set((data||[]).map(x=>x.time));slotsEl.innerHTML="";slots.forEach(s=>{let b=document.createElement("button");b.type="button";b.className="slot";b.textContent=s;b.disabled=booked.has(s);b.onclick=()=>{document.querySelectorAll(".slot").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");time.value=s};slotsEl.appendChild(b)})}
async function book(){msg.textContent="";let chosen=combo.value?`Combo: ${combo.value}`:service.value;if(!name.value.trim()||!phone.value.trim()||!chosen||!date.value||!time.value){msg.textContent="Please fill all required fields and choose a service/combo and available time.";return}let {error}=await db.from("appointments").insert({source_id:"web-"+Date.now(),name:name.value.trim(),phone:phone.value.trim(),email:email.value.trim(),service:chosen,date:date.value,time:time.value,status:"Pending"});if(error){msg.textContent=error.message;return}msg.textContent="Booking submitted successfully!";document.querySelectorAll("input,select").forEach(x=>x.value="");time.value="";loadSlots()}
date.addEventListener("change",loadSlots);service.addEventListener("change",showRates);combo.addEventListener("change",showRates);loadServices();const slotsEl=document.getElementById("slots");loadSlots();
</script></body></html>
