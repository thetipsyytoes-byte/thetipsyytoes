<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | The Tipssy Toe</title><style>body{margin:0;background:#0d0c0b;color:#fff;font-family:Arial;display:grid;place-items:center;min-height:100vh}.card{width:min(390px,90%);background:#171411;padding:30px;border-radius:18px}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 15px;border-radius:9px;border:1px solid #514631;background:#0d0c0b;color:#fff}button{width:100%;padding:13px;border:0;border-radius:9px;background:#c7a56a;font-weight:bold;cursor:pointer}.err{color:#e99;margin-top:12px;text-align:center}</style></head><body><div class="card"><h2>Admin Login</h2><label>Login ID</label><input id="id"><label>Password</label><input id="pw" type="password"><button onclick="login()">Login</button><div id="err" class="err"></div></div><script>const ADMIN_ID="thetipsyytoes",ADMIN_PASSWORD="Maninder@123";function login(){if(id.value===ADMIN_ID&&pw.value===ADMIN_PASSWORD){sessionStorage.setItem("tipssyToeAdminLoggedIn","true");location.href="admin-dashboard.html"}else err.textContent="Wrong Login ID or Password."}</script></body></html>
