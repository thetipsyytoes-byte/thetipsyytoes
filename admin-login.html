<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | The Tipssy Toe</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f7f1e8;color:#211b16}
.card{width:min(420px,92%);padding:42px 34px;border-radius:20px;background:#fff;border:1px solid #d6b47b;box-shadow:0 18px 50px rgba(0,0,0,.12)}
.brand{text-align:center;letter-spacing:2px;font-weight:700;font-size:20px}.sub{text-align:center;color:#8d6a3e;margin:7px 0 28px;letter-spacing:1px}
label{display:block;font-size:13px;margin:16px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d8c8b5;border-radius:10px;font-size:15px;outline:none}
button{width:100%;margin-top:22px;padding:13px;border-radius:10px;border:1px solid #a8793c;background:#a8793c;color:#fff;font-weight:700;cursor:pointer}
#error{color:#b3261e;text-align:center;font-size:13px;margin-top:14px;min-height:18px}.back{text-align:center;margin-top:20px;font-size:13px}.back a{color:#8d6a3e;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<div class="brand">THE TIPSSY TOE</div>
<div class="sub">ADMIN LOGIN · MAKEOVER STUDIO</div>
<form id="loginForm">
<label for="loginId">Login ID</label>
<input id="loginId" type="text" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button type="submit">Login to Admin Dashboard</button>
<div id="error"></div>
</form>
<div class="back"><a href="index.html">← Back to Website</a></div>
</div>
<script>
const ADMIN_ID="thetipsyytoes";
const ADMIN_PASSWORD="Maninder@123";
document.getElementById("loginForm").addEventListener("submit",function(e){
 e.preventDefault();
 const id=document.getElementById("loginId").value.trim();
 const password=document.getElementById("password").value;
 if(id===ADMIN_ID && password===ADMIN_PASSWORD){
   sessionStorage.setItem("tipssyToeAdminLoggedIn","true");
   window.location.href="admin-dashboard.html";
 }else{
   document.getElementById("error").textContent="Wrong Login ID or Password.";
 }
});
</script>
</body>
</html>
