<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login | The Tipssy Toe Makeover Studio</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f1e8;color:#191613;font-family:Arial,sans-serif}
.card{width:min(430px,92%);background:#090807;color:#fff;padding:38px;border-radius:18px;border:1px solid #76572e;box-shadow:0 20px 60px #0002}
h1{font-family:Georgia,serif;font-weight:500;margin:0 0 6px;color:#e6c184} p{color:#aaa29a;font-size:13px}
label{display:block;font-size:12px;margin:18px 0 7px;color:#d8c8b3}
input{width:100%;padding:13px;border-radius:8px;border:1px solid #5c4932;background:#11100e;color:#fff}
button{width:100%;margin-top:22px;padding:14px;border-radius:8px;border:1px solid #c99a55;background:transparent;color:#e6c184;font-weight:700;cursor:pointer}
.switch{text-align:center;margin-top:18px;font-size:12px}.switch a{color:#e6c184;cursor:pointer}
.hidden{display:none}.msg{margin-top:14px;font-size:12px;color:#e6c184}
</style>
</head>
<body>
<div class="card">
  <h1>THE TIPSSY TOE</h1>
  <p>Customer Account</p>

  <form id="loginForm">
    <label>Mobile / Email</label>
    <input id="loginId" required placeholder="Enter mobile or email">
    <label>Password</label>
    <input id="loginPass" type="password" required placeholder="Enter password">
    <button type="submit">Customer Login</button>
  </form>

  <form id="registerForm" class="hidden">
    <label>Full Name</label>
    <input id="regName" required placeholder="Your name">
    <label>Mobile / Email</label>
    <input id="regId" required placeholder="Mobile or email">
    <label>Password</label>
    <input id="regPass" type="password" required minlength="4" placeholder="Create password">
    <button type="submit">Create Customer Account</button>
  </form>

  <div class="switch">
    <span id="loginSwitch">New customer? <a onclick="showRegister()">Create account</a></span>
    <span id="registerSwitch" class="hidden">Already have an account? <a onclick="showLogin()">Login</a></span>
  </div>
  <div id="msg" class="msg"></div>
</div>
<script>
const key='tipssyToeCustomer';
function showRegister(){loginForm.classList.add('hidden');registerForm.classList.remove('hidden');loginSwitch.classList.add('hidden');registerSwitch.classList.remove('hidden');msg.textContent='';}
function showLogin(){registerForm.classList.add('hidden');loginForm.classList.remove('hidden');registerSwitch.classList.add('hidden');loginSwitch.classList.remove('hidden');msg.textContent='';}
registerForm.onsubmit=e=>{
 e.preventDefault();
 localStorage.setItem(key,JSON.stringify({name:regName.value,id:regId.value,password:regPass.value}));
 msg.textContent='Account created successfully. You can now login.';
 showLogin();
};
loginForm.onsubmit=e=>{
 e.preventDefault();
 const u=JSON.parse(localStorage.getItem(key)||'null');
 if(u && u.id===loginId.value && u.password===loginPass.value){
   msg.textContent='Login successful. Welcome, '+u.name+'!';
 }else msg.textContent='Account not found or password is incorrect.';
};
</script>
</body>
</html>
