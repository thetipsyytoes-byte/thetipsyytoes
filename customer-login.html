<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Login</title><style>body{font-family:Arial;background:#f7f3ee;display:grid;place-items:center;min-height:100vh}.card{background:#fff;padding:28px;border-radius:18px;width:min(400px,90%)}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:9px}button{width:100%;padding:13px;background:#b58b5b;color:white;border:0;border-radius:9px;font-weight:bold}</style></head><body><div class="card"><h2>Customer Login</h2><input id="name" placeholder="Full Name"><input id="mobile" placeholder="Mobile"><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="save()">Create / Login</button><p id="msg"></p></div><script>function save(){if(!name.value.trim()||!mobile.value.trim()||!password.value)return msg.textContent="Name, mobile and password required.";localStorage.setItem("tipssyToeCustomer",JSON.stringify({name:name.value,mobile:mobile.value,email:email.value}));msg.textContent="Customer login saved on this browser."}</script></body></html>
