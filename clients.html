<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Records | The Tipssy Toe Makeover Studio</title>
<style>
*{box-sizing:border-box}
:root{--black:#0d0c0b;--black2:#171411;--gold:#c7a56a;--gold2:#e0c28b;--cream:#f7f3eb;--line:rgba(199,165,106,.18);--muted:#918b81}
body{margin:0;background:#f5f1e9;color:#171512;font-family:Arial,Helvetica,sans-serif}
.sidebar{position:fixed;left:0;top:0;width:255px;height:100vh;background:linear-gradient(180deg,#0b0a09,#171411);color:#fff;padding:28px 18px;z-index:10;border-right:1px solid var(--line)}
.brand{padding:5px 12px 28px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand small{color:var(--gold);font-size:10px;letter-spacing:3px;text-transform:uppercase}
.brand h2{margin:9px 0 3px;font-family:Georgia,serif;font-weight:normal;font-size:23px;line-height:1.15}
.brand span{color:#aaa39a;font-size:11px;letter-spacing:1px}
.menu-title{color:#706b63;font-size:9px;letter-spacing:2px;margin:20px 12px 9px;text-transform:uppercase}
.nav button{width:100%;border:0;background:transparent;color:#b9b3aa;text-align:left;padding:12px 13px;border-radius:8px;cursor:pointer;font-size:13px;margin:2px 0}
.nav button:hover,.nav button.active{background:rgba(199,165,106,.12);color:#fff}
.nav button.active{border-left:2px solid var(--gold)}
.logout{position:absolute;bottom:25px;left:18px;right:18px;border:1px solid rgba(199,165,106,.25)!important;color:#c7a56a!important}
main{margin-left:255px;padding:34px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}
.eyebrow{color:#a68b5a;font-size:10px;letter-spacing:3px;text-transform:uppercase}
h1{font-family:Georgia,serif;font-size:34px;font-weight:normal;margin:7px 0}
.top p{margin:0;color:#777;font-size:13px}
.btn{border:1px solid var(--gold);background:var(--black);color:#fff;padding:11px 17px;border-radius:7px;cursor:pointer}
.btn.gold{background:var(--gold);color:#15120d}
.card{background:#fff;border:1px solid #e6dfd3;border-radius:13px;box-shadow:0 8px 25px rgba(30,25,18,.05);padding:22px;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:22px}
.stat small{display:block;color:#8b847a;text-transform:uppercase;letter-spacing:1.5px;font-size:9px}
.stat strong{display:block;font-family:Georgia,serif;font-size:29px;margin-top:7px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.search{flex:1;max-width:500px;border:1px solid #ddd5c9;border-radius:8px;padding:12px 14px;font-size:13px;outline:none}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:1.3px;color:#8d857a;padding:12px;border-bottom:1px solid #e8e0d5}
td{padding:14px 12px;border-bottom:1px solid #eee8df;font-size:13px}
.name{font-weight:bold}.muted{font-size:11px;color:#888}
.actions button{border:0;background:#f0ebe3;padding:7px 10px;border-radius:6px;cursor:pointer;margin-right:4px;font-size:11px}
.actions .del{color:#a44;background:#f8eaea}
.empty{text-align:center;padding:45px;color:#999}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modalbox{background:#fff;border-radius:14px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:25px}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modalhead h2{font-family:Georgia,serif;font-weight:normal;margin:0}
.close{border:0;background:#eee8df;border-radius:50%;width:34px;height:34px;cursor:pointer}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:1px}
.field input,.field select,.field textarea{border:1px solid #ddd5c9;border-radius:7px;padding:11px;font:inherit;outline:none}
.field textarea{min-height:90px;resize:vertical}
.formactions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.cancel{background:#eee8df;color:#333;border:0;padding:11px 17px;border-radius:7px;cursor:pointer}
@media(max-width:850px){.sidebar{width:210px}.brand h2{font-size:19px}main{margin-left:210px;padding:20px}.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
@media(max-width:650px){.sidebar{position:relative;width:100%;height:auto}.logout{position:static;margin-top:15px}main{margin-left:0}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <small>Admin Portal</small>
    <h2>The Tipssy Toe</h2>
    <span>Makeover Studio</span>
  </div>
  <div class="menu-title">Management</div>
  <div class="nav">
    <button onclick="go('dashboard')">Dashboard</button>
    <button class="active">👤 Client Records</button>
    <button onclick="go('appointments')">📅 Appointments</button>
    <button onclick="go('billing')">💳 Billing</button>
    <button onclick="go('services')">✦ Services</button>
    <button onclick="go('staff')">👥 Staff</button>
    <button onclick="go('inventory')">📦 Inventory</button>
    <button onclick="go('reports')">📊 Reports</button>
    <button onclick="go('settings')">⚙ Settings</button>
  </div>
  <button class="nav button logout" onclick="logout()">Logout</button>
</aside>

<main>
  <div class="top">
    <div>
      <div class="eyebrow">Customer Management</div>
      <h1>Client Records</h1>
      <p>Keep all salon client information organised in one place.</p>
    </div>
    <button class="btn gold" onclick="openForm()">+ Add Client</button>
  </div>

  <section class="stats">
    <div class="card stat"><small>Total Clients</small><strong id="total">0</strong></div>
    <div class="card stat"><small>Active Records</small><strong id="active">0</strong></div>
    <div class="card stat"><small>New This Month</small><strong id="newMonth">0</strong></div>
  </section>

  <section class="card">
    <div class="toolbar">
      <input id="search" class="search" placeholder="Search by client name, mobile or email..." oninput="render()">
      <span class="muted" id="count"></span>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Client</th><th>Mobile</th><th>Preferred Service</th><th>Last Visit</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="modalbox">
    <div class="modalhead">
      <h2 id="modalTitle">Add Client Record</h2>
      <button class="close" onclick="closeForm()">×</button>
    </div>
    <form id="clientForm" onsubmit="saveClient(event)">
      <input type="hidden" id="editId">
      <div class="formgrid">
        <div class="field"><label>Full Name *</label><input id="name" required></div>
        <div class="field"><label>Mobile *</label><input id="phone" required></div>
        <div class="field"><label>Email</label><input id="email" type="email"></div>
        <div class="field"><label>Date of Birth</label><input id="dob" type="date"></div>
        <div class="field"><label>Gender</label><select id="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option></select></div>
        <div class="field"><label>Preferred Service</label><input id="service" placeholder="Hair, Nails, Facial..."></div>
        <div class="field"><label>Last Visit</label><input id="lastVisit" type="date"></div>
        <div class="field"><label>Status</label><select id="status"><option>Active</option><option>Inactive</option></select></div>
        <div class="field full"><label>Address</label><input id="address"></div>
        <div class="field full"><label>Notes</label><textarea id="notes" placeholder="Client preferences, colour choices, special notes..."></textarea></div>
      </div>
      <div class="formactions">
        <button type="button" class="cancel" onclick="closeForm()">Cancel</button>
        <button type="submit" class="btn gold">Save Client</button>
      </div>
    </form>
  </div>
</div>

<script>
if(sessionStorage.getItem("tipssyToeAdminLoggedIn") !== "true"){
  window.location.href="admin-login.html";
}

let clients = JSON.parse(localStorage.getItem("tipssy_clients") || "[]");

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function persist(){ localStorage.setItem("tipssy_clients",JSON.stringify(clients)); }
function render(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  const filtered=clients.filter(c=>[c.name,c.phone,c.email,c.service].join(" ").toLowerCase().includes(q));
  document.getElementById("total").textContent=clients.length;
  document.getElementById("active").textContent=clients.filter(c=>c.status!=="Inactive").length;
  const now=new Date(), month=now.getMonth(), year=now.getFullYear();
  document.getElementById("newMonth").textContent=clients.filter(c=>{
    const d=new Date(c.createdAt||""); return d.getMonth()===month && d.getFullYear()===year;
  }).length;
  document.getElementById("count").textContent=filtered.length+" record"+(filtered.length===1?"":"s");
  const rows=document.getElementById("rows");
  if(!filtered.length){rows.innerHTML='<tr><td colspan="6" class="empty">No client records found.</td></tr>';return;}
  rows.innerHTML=filtered.map(c=>`
    <tr>
      <td><div class="name">${esc(c.name)}</div><div class="muted">${esc(c.email||"No email")}</div></td>
      <td>${esc(c.phone)}</td>
      <td>${esc(c.service||"—")}</td>
      <td>${esc(c.lastVisit||"—")}</td>
      <td>${c.status==="Inactive"?"Inactive":"Active"}</td>
      <td class="actions"><button onclick="editClient('${c.id}')">Edit</button><button class="del" onclick="deleteClient('${c.id}')">Delete</button></td>
    </tr>`).join("");
}
function openForm(c=null){
  document.getElementById("modal").classList.add("show");
  document.getElementById("modalTitle").textContent=c?"Edit Client Record":"Add Client Record";
  document.getElementById("editId").value=c?.id||"";
  document.getElementById("name").value=c?.name||"";
  document.getElementById("phone").value=c?.phone||"";
  document.getElementById("email").value=c?.email||"";
  document.getElementById("dob").value=c?.dob||"";
  document.getElementById("gender").value=c?.gender||"";
  document.getElementById("service").value=c?.service||"";
  document.getElementById("lastVisit").value=c?.lastVisit||"";
  document.getElementById("status").value=c?.status||"Active";
  document.getElementById("address").value=c?.address||"";
  document.getElementById("notes").value=c?.notes||"";
}
function closeForm(){document.getElementById("modal").classList.remove("show");document.getElementById("clientForm").reset();document.getElementById("editId").value="";}
function saveClient(e){
  e.preventDefault();
  const id=document.getElementById("editId").value;
  const old=clients.find(c=>c.id===id);
  const data={
    id:id||("client_"+Date.now()),
    name:document.getElementById("name").value.trim(),
    phone:document.getElementById("phone").value.trim(),
    email:document.getElementById("email").value.trim(),
    dob:document.getElementById("dob").value,
    gender:document.getElementById("gender").value,
    service:document.getElementById("service").value.trim(),
    lastVisit:document.getElementById("lastVisit").value,
    status:document.getElementById("status").value,
    address:document.getElementById("address").value.trim(),
    notes:document.getElementById("notes").value.trim(),
    createdAt:old?.createdAt||new Date().toISOString()
  };
  if(old){clients=clients.map(c=>c.id===id?data:c);}else{clients.push(data);}
  persist(); render(); closeForm();
}
function editClient(id){const c=clients.find(x=>x.id===id);if(c)openForm(c);}
function deleteClient(id){
  const c=clients.find(x=>x.id===id);
  if(c && confirm("Delete client record for "+c.name+"?")){clients=clients.filter(x=>x.id!==id);persist();render();}
}
function go(page){
  const pages={dashboard:"admin-dashboard.html",clients:"clients.html",appointments:"appointments.html",billing:"billing.html",services:"services.html",staff:"staff.html",inventory:"inventory.html",reports:"reports.html",settings:"settings.html"};
  if(pages[page]) window.location.href=pages[page];
}
function logout(){
  sessionStorage.removeItem("tipssyToeAdminLoggedIn");
  window.location.href="admin-login.html";
}
render();
</script>
</body>
</html>
